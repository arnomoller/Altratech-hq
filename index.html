<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Altratech Outreach HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky status header + tab strip, one readable column of cards (max 880px), phone first. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E9EEEC; --ink:#12262B; --muted:#5A6C6F; --line:#D8E0DE;
  --accent:#C9481A; --accent-ink:#FFFFFF; --accent-soft:#FBE4D9;
  --good:#1D7A51; --good-soft:#DCF0E5; --warn:#9A5B00; --warn-soft:#FAEACB; --bad:#B0281F; --bad-soft:#F8DEDB;
  --a1:#2F6FB0; --a2:#8A4FBF; --a3:#1D7A51; --a4:#C9481A; --a5:#B07A00; --a6:#C23B7A; --a7:#5A6C6F;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E181A; --surface:#152327; --sunk:#1B2C31; --ink:#E6EEEC; --muted:#93A6A7; --line:#253A3F;
  --accent:#F27A46; --accent-ink:#1B0C05; --accent-soft:#3B2217;
  --good:#5DCB93; --good-soft:#163428; --warn:#E8B14E; --warn-soft:#33270E; --bad:#F2897F; --bad-soft:#3B1C1A;
  --a1:#73A9E6; --a2:#BC90EA; --a3:#5DCB93; --a4:#F27A46; --a5:#E8B14E; --a6:#EE7FB3; --a7:#93A6A7;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E181A; --surface:#152327; --sunk:#1B2C31; --ink:#E6EEEC; --muted:#93A6A7; --line:#253A3F;
  --accent:#F27A46; --accent-ink:#1B0C05; --accent-soft:#3B2217;
  --good:#5DCB93; --good-soft:#163428; --warn:#E8B14E; --warn-soft:#33270E; --bad:#F2897F; --bad-soft:#3B1C1A;
  --a1:#73A9E6; --a2:#BC90EA; --a3:#5DCB93; --a4:#F27A46; --a5:#E8B14E; --a6:#EE7FB3; --a7:#93A6A7;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font:700 19px/1.1 var(--f-display);letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:8px}
.brand .flag,.flag{display:inline-flex;flex:none}
.bar .spacer{flex:1}
.statusrow{flex-basis:100%;display:flex;min-width:0}
@media (min-width:700px){.statusrow{flex-basis:auto;order:-1;margin-left:4px}.bar .brand{order:-2}}
.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:5px 11px;border-radius:99px;background:var(--sunk);min-width:0}
.status b{font-weight:600}
.status.on{background:var(--good-soft);color:var(--good)}
.status.q{background:var(--warn-soft);color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.status.on .dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status.on .dot{animation:none}}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:7px 12px;border-radius:99px;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab .n{font:500 12px var(--f-mono);background:var(--sunk);color:var(--ink);border-radius:99px;padding:1px 7px}
.tab[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}
main{padding-block:18px 64px;display:flex;flex-direction:column;gap:16px}
h2{font:700 20px/1.2 var(--f-display);margin:8px 0 0;text-wrap:balance}
h3{font:600 17px/1.25 var(--f-display);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font:600 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.hl{border-color:var(--accent);background:var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--ink);max-width:100%}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.hot{background:var(--accent-soft);color:var(--accent)}
.agent{font:500 12px var(--f-mono);padding:1px 7px;border-radius:6px;background:var(--sunk);white-space:nowrap}
.agent::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--c,var(--a7));vertical-align:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.55;cursor:default}
.email{background:var(--sunk);border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.email .subj{font-weight:600;margin-bottom:8px;white-space:normal}
.email .foot{color:var(--muted);font-size:13px;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 12px;white-space:pre-wrap;word-break:break-word}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] summary .chev{transform:rotate(90deg)}
.chev{display:inline-block;transition:transform .15s;color:var(--muted)}
.item{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.item>*{min-width:0}
.item .name{font-weight:600}
.list>*+*{border-top:1px solid var(--line)}
.list>*{padding-block:10px}
.feed{display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.feed .ev{display:grid;grid-template-columns:44px auto 1fr;gap:8px;align-items:baseline}
.feed .ev .msg{min-width:0;word-break:break-word}
.ev.error .msg{color:var(--bad)}.ev.warn .msg{color:var(--warn)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px}
.warnbox code{font-family:var(--f-mono);font-size:13px}
.needs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.needs .card{display:flex;flex-direction:column;gap:6px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
input[type=search],input[type=password],input[type=text],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.filters{display:grid;grid-template-columns:1fr auto;gap:8px}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 24px rgb(0 0 0 / .2)}
.demo{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;padding-block:6px;text-align:center}
.setup{max-width:560px;margin:0 auto;padding-block:32px 64px;display:flex;flex-direction:column;gap:16px}
.setup h1{font:700 30px/1.1 var(--f-display);margin:0;text-wrap:balance}
.setup ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.err{color:var(--bad);font-weight:600}
.pending{font-size:13px;color:var(--warn);font-weight:600}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";
const DEFAULT_REPO = "arnomoller/Altratech-outreach";
const TZ = "Africa/Johannesburg";
const PREVIEW = !!window.HQ_PREVIEW;  // set when shown as a preview with example data
const AGENTS = {hq:"--a1", scout:"--a2", copywriter:"--a6", compliance:"--a3", postman:"--a4", inbox:"--a5", hype:"--a2", you:"--a7", dashboard:"--a7"};
const REPLY = {interested:["Keen","hot"], question:["Question","hot"], not_interested:["Not keen",""], unsubscribe:["Said stop","bad"], auto_reply:["Auto-reply",""], other:["Other",""]};
const STATUS = {new:["Found",""], drafted:["Draft","warn"], approved:["Approved","good"], sent:["Emailed","good"], replied:["Replied","hot"], opted_out:["Opted out","bad"], rejected:["Skipped",""], failed:["Failed","bad"]};

const store = {
  get(k){ try { return localStorage.getItem("hq."+k) || ""; } catch(e){ return ""; } },
  set(k,v){ try { v ? localStorage.setItem("hq."+k, v) : localStorage.removeItem("hq."+k); } catch(e){} }
};
// ---------- password lock ----------
// The GitHub key is stored encrypted with your password (PBKDF2 + AES-GCM) and only
// decrypted in memory. Unlocking lasts for this tab, up to 12 hours or 30 minutes away.
const SESSION_MS = 12*3600e3, AWAY_MS = 30*60e3;
const b64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
function sessionToken(){
  try{
    const s = JSON.parse(sessionStorage.getItem("hq.session") || "null");
    if(s && Date.now() - s.at < SESSION_MS) return s.token;
  }catch(e){}
  return "";
}
function setSession(token){
  try{ token ? sessionStorage.setItem("hq.session", JSON.stringify({token, at:Date.now()})) : sessionStorage.removeItem("hq.session"); }catch(e){}
}
async function deriveKey(password, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:310000, hash:"SHA-256"}, base,
    {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function seal(token, password){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, await deriveKey(password, salt), new TextEncoder().encode(token));
  store.set("vault", JSON.stringify({v:1, salt:b64(salt), iv:b64(iv), ct:b64(ct)}));
}
async function unseal(password){
  const v = JSON.parse(store.get("vault"));
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(v.iv)}, await deriveKey(password, unb64(v.salt)), unb64(v.ct));
  return new TextDecoder().decode(pt);
}
function lock(){ S.token = ""; S.data = null; S.issue = null; setSession(""); render(); }

const S = {
  token: PREVIEW ? "" : sessionToken(),
  hasVault: !!store.get("vault"), legacy: store.get("token"), fails: 0, waitUntil: 0, confirmReset: false, busy: false,
  repo: store.get("repo") || DEFAULT_REPO,
  demo: PREVIEW,
  data: null, run: null, issue: null, error: "", loading: false, loadedAt: null,
  tab: "today", q: "", status: "all", replyFilter: "all",
  pending: {}, toast: "", toastTimer: 0
};

// ---------- helpers ----------
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayKey = d => new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
const fmt = (d,o) => new Intl.DateTimeFormat("en-ZA",Object.assign({timeZone:TZ},o)).format(d);
const hm = ts => ts ? fmt(new Date(ts),{hour:"2-digit",minute:"2-digit",hour12:false}) : "";
function when(ts){
  if(!ts) return "";
  const d = new Date(ts), k = dayKey(d), today = dayKey(new Date()), yest = dayKey(new Date(Date.now()-864e5));
  if(k===today) return "today " + hm(ts);
  if(k===yest) return "yesterday " + hm(ts);
  return fmt(d,{day:"numeric",month:"short"}) + " " + hm(ts);
}
function dayLabel(k){
  const today = dayKey(new Date()), yest = dayKey(new Date(Date.now()-864e5));
  if(k===today) return "Today";
  if(k===yest) return "Yesterday";
  return fmt(new Date(k+"T12:00:00+02:00"),{weekday:"long",day:"numeric",month:"long"});
}
const isToday = ts => ts && dayKey(new Date(ts)) === dayKey(new Date());
const chip = (pair) => `<span class="chip ${pair[1]}">${esc(pair[0])}</span>`;
const agent = a => `<span class="agent" style="--c:var(${AGENTS[a]||"--a7"})">${esc(a)}</span>`;
function nextRun(){
  // Weekdays 08:15 SA time (06:15 UTC).
  const now = new Date();
  for(let i=0;i<8;i++){
    const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()+i, 6, 15));
    const wd = d.getUTCDay();
    if(wd>=1 && wd<=5 && d > now) return d;
  }
  return null;
}

// ---------- GitHub ----------
async function gh(path, opts){
  opts = opts || {};
  const res = await fetch("https://api.github.com"+path, {
    method: opts.method || "GET",
    cache: "no-store",
    headers: Object.assign({
      "Authorization": "Bearer "+S.token,
      "Accept": opts.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    }, opts.body ? {"Content-Type":"application/json"} : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(res.status===401) throw Object.assign(new Error("GitHub didn't accept that key. Create a new one and paste it in again."),{auth:true});
  if(!res.ok){ const e = new Error("GitHub said "+res.status+" for "+path.split("?")[0]); e.status = res.status; throw e; }
  return opts.raw ? res.text() : res.json();
}

async function load(){
  if(S.demo){ S.data = demoData(); S.run = S.data.running ? {status:"in_progress", html_url:"#", created_at:S.data.running.started_at} : null; S.loadedAt = new Date(); render(); return; }
  if(!S.token) return;
  S.loading = true; render();
  try{
    const [snap, runs] = await Promise.all([
      gh(`/repos/${S.repo}/contents/snapshot.json?ref=dashboard`, {raw:true}).then(JSON.parse).catch(e => { if(e.status===404) return null; throw e; }),
      gh(`/repos/${S.repo}/actions/runs?per_page=5`).catch(() => null)
    ]);
    S.data = snap;
    const active = runs && runs.workflow_runs ? runs.workflow_runs.find(r => r.status==="in_progress" || r.status==="queued") : null;
    S.run = active || null;
    S.lastRun = runs && runs.workflow_runs ? runs.workflow_runs.find(r => r.status==="completed") : null;
    S.error = ""; S.loadedAt = new Date();
    // Clear pending actions the crew has now handled.
    for(const k in S.pending){ if(Date.now() - S.pending[k].at > 20*60e3) delete S.pending[k]; }
  }catch(e){
    S.error = e.message;
    if(e.auth){ S.token = ""; setSession(""); store.set("vault",""); S.hasVault = false; }
  }
  S.loading = false; render();
}

async function findIssue(){
  if(S.issue) return S.issue;
  const list = await gh(`/repos/${S.repo}/issues?labels=outreach-hq&state=open&per_page=1`);
  if(!list.length) throw new Error("The HQ issue doesn't exist yet. Run the crew once from GitHub Actions first.");
  return (S.issue = list[0].number);
}

async function command(text, key, label){
  if(S.demo){ showToast("Example mode: nothing was sent."); return; }
  try{
    const n = await findIssue();
    await gh(`/repos/${S.repo}/issues/${n}/comments`, {method:"POST", body:{body:text}});
    if(key) S.pending[key] = {label, at:Date.now()};
    showToast(label + ". The crew starts in about a minute.");
    setTimeout(load, 15000);
  }catch(e){ showToast(e.message); }
  render();
}

function showToast(t){ S.toast = t; clearTimeout(S.toastTimer); S.toastTimer = setTimeout(()=>{ S.toast=""; render(); }, 4500); render(); }

// ---------- derived data ----------
function derive(){
  const d = S.data || {leads:[],drafts:[],sends:[],replies:[],events:[],stats:{},settings:{missing:[]}};
  const leads = new Map(d.leads.map(l => [l.id, l]));
  const drafts = new Map(d.drafts.map(x => [x.lead_id, x]));
  const sent = d.sends.filter(s => s.status==="sent" || s.status==="failed");
  const replies = d.replies.filter(r => r.category!=="auto_reply");
  const waiting = d.leads.filter(l => (l.status==="drafted"||l.status==="approved") && drafts.has(l.id)).sort((a,b)=>a.id-b.id);
  const today = {
    found: d.leads.filter(l => isToday(l.created_at)).length,
    written: d.drafts.filter(x => isToday(x.created_at)).length,
    emailed: sent.filter(s => s.status==="sent" && isToday(s.sent_at)).length,
    replies: replies.filter(r => isToday(r.received_at)).length,
    optouts: d.leads.filter(l => l.status==="opted_out" && isToday(l.updated_at)).length
  };
  const hot = replies.filter(r => r.category==="interested" || r.category==="question");
  return {d, leads, drafts, sent, replies, waiting, today, hot};
}

// ---------- views ----------
function render(){
  const app = document.getElementById("app");
  const focusId = document.activeElement && document.activeElement.id;
  // Keep whatever was typed into the setup/lock forms across re-renders.
  const typed = {};
  app.querySelectorAll("form input").forEach(i => { if(i.id) typed[i.id] = i.value; });
  app.innerHTML = (S.demo || S.token) ? viewApp() : S.hasVault ? viewLock() : viewSetup();
  for(const id in typed){ const el = document.getElementById(id); if(el && el.closest("form")) el.value = typed[id]; }
  if(focusId){ const el = document.getElementById(focusId); if(el){ el.focus(); if(el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } }
}

function viewSetup(){
  return `<div class="wrap"><div class="setup">
    <div class="row"><span class="flag">${flag()}</span><span class="sub">Altratech Outreach HQ</span></div>
    <h1>See everything your outreach crew is doing</h1>
    <p class="sub" style="margin:0">This page reads your crew's data straight from your private GitHub repo, using a key that stays on this phone.</p>
    <div class="card stack">
      <h3>Connect once (2 minutes)</h3>
      <ol>
        <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → new fine-grained token</a>.</li>
        <li>Name it <b>Outreach HQ</b>. Under <b>Repository access</b> pick <b>Only select repositories</b> → <b>Altratech-outreach</b>.</li>
        <li>Under <b>Permissions</b> set <b>Contents: Read</b>, <b>Issues: Read and write</b>, <b>Actions: Read</b>.</li>
        <li>Tap <b>Generate token</b>, copy it, and paste it here.</li>
      </ol>
      <form id="connect" class="stack" onsubmit="return false">
        <label for="tok" class="sub">GitHub token</label>
        <input id="tok" type="password" autocomplete="off" placeholder="github_pat_…" value="${esc(S.legacy)}">
        <label for="repo" class="sub">Repository</label>
        <input id="repo" type="text" value="${esc(S.repo)}">
        <label for="pw1" class="sub">Choose a password for this dashboard (at least 8 characters)</label>
        <input id="pw1" type="password" autocomplete="new-password">
        <label for="pw2" class="sub">Type it again</label>
        <input id="pw2" type="password" autocomplete="new-password">
        ${S.error ? `<div class="err">${esc(S.error)}</div>` : ""}
        <div class="row"><button class="btn primary" id="go" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? "Locking…" : "Lock with my password and open"}</button>
        <button class="btn ghost" id="try" type="button">Look around with example data</button></div>
      </form>
    </div>
    <p class="sub" style="margin:0">The key is saved only on this device, encrypted with your password. Without the password nobody can open your dashboard or see your data. The key can only read your outreach repo and post commands to the crew.</p>

function statusPill(){
  const running = S.run && (S.run.status==="in_progress" || S.run.status==="queued");
  const snapRun = S.data && S.data.running;
  if(running && S.run.status==="queued") return `<span class="status q"><span class="dot"></span><b>Starting up…</b></span>`;
  if(running || snapRun){
    const what = snapRun ? snapRun.action : "working";
    const since = (snapRun && snapRun.started_at) || (S.run && S.run.run_started_at) || "";
    const url = (S.run && S.run.html_url) || (snapRun && snapRun.run_url) || "";
    return `<span class="status on"><span class="dot"></span><span><b>Crew working</b> · ${esc(what)}${since ? " since " + hm(since) : ""}</span>${url && url!=="#" ? ` <a href="${esc(url)}" target="_blank" rel="noopener">watch</a>` : ""}</span>`;
  }
  const nr = nextRun();
  return `<span class="status"><span class="dot" style="color:var(--muted)"></span><span><b>Resting</b>${nr ? " · next run " + esc(fmt(nr,{weekday:"short"})) + " 08:15" : ""}</span></span>`;
}

function chart14(v){
  const days = [];
  for(let i=13;i>=0;i--) days.push(dayKey(new Date(Date.now()-i*864e5)));
  const sent = days.map(k => v.sent.filter(s => s.status==="sent" && dayKey(new Date(s.sent_at))===k).length);
  const found = days.map(k => v.d.leads.filter(l => dayKey(new Date(l.created_at))===k).length);
  const max = Math.max(4, ...sent, ...found);
  if(!sent.some(Boolean) && !found.some(Boolean)) return "";
  const W=560, H=150, pl=28, pb=22, pt=8, bw=(W-pl)/14;
  const y = n => pt + (H-pt-pb) * (1 - n/max);
  const ticks = [0, Math.round(max/2), max];
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Businesses found and emails sent per day, last 14 days">`;
  ticks.forEach(t => { svg += `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`; });
  days.forEach((k,i) => {
    const x = pl + i*bw;
    svg += `<rect x="${x+bw*.14}" y="${y(found[i])}" width="${bw*.34}" height="${y(0)-y(found[i])}" rx="2" fill="var(--line)"><title>${found[i]} found</title></rect>`;
    svg += `<rect x="${x+bw*.52}" y="${y(sent[i])}" width="${bw*.34}" height="${y(0)-y(sent[i])}" rx="2" fill="var(--accent)"><title>${sent[i]} emailed</title></rect>`;
    if(i%2===1 || i===13) svg += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(fmt(new Date(k+"T12:00:00+02:00"),{day:"numeric",month:"short"}))}</text>`;
  });
  svg += `</svg>`;
  return `<div class="card stack"><div class="item"><h3>Last 14 days</h3><span class="row sub"><span class="row" style="gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:var(--line);display:inline-block"></span>found</span><span class="row" style="gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block"></span>emailed</span></span></div>${svg}</div>`;
}

// ---------- events ----------
document.addEventListener("click", async e => {
  const t = e.target.closest("button,[data-tab]");
  if(!t) return;
  if(t.dataset.tab){ S.tab = t.dataset.tab; try{ history.replaceState(null,"","#"+S.tab); }catch(_){} render(); window.scrollTo(0,0); return; }
  if(t.dataset.rf){ S.replyFilter = t.dataset.rf; render(); return; }
  if(t.dataset.cmd){ command(t.dataset.cmd, t.dataset.key, t.dataset.label); return; }
  if(t.dataset.copy != null){
    try{ await navigator.clipboard.writeText(t.dataset.copy); showToast("Copied"); }
    catch(_){ showToast("Couldn't copy. Press and hold the text to copy it."); }
    return;
  }
  if(t.id==="refresh"){ load(); return; }
  if(t.id==="try"){ S.demo = true; load(); return; }
  if(t.id==="exitdemo"){ S.demo = false; S.data = null; render(); return; }
  if(t.id==="lock"){ lock(); return; }
  if(t.id==="forgot"){ S.confirmReset = true; render(); return; }
  if(t.id==="noreset"){ S.confirmReset = false; render(); return; }
  if(t.id==="reset"){ store.set("vault",""); store.set("token",""); S.hasVault = false; S.legacy = ""; S.confirmReset = false; S.error = ""; lock(); return; }
  if(t.id==="go"){
    const tok = document.getElementById("tok").value.trim(), repo = document.getElementById("repo").value.trim() || DEFAULT_REPO;
    const pw1 = document.getElementById("pw1").value, pw2 = document.getElementById("pw2").value;
    if(!tok){ S.error = "Paste your GitHub token first."; render(); return; }
    if(pw1.length < 8){ S.error = "Pick a password of at least 8 characters."; render(); return; }
    if(pw1 !== pw2){ S.error = "The two passwords don't match."; render(); return; }
    S.busy = true; render();
    try{ await seal(tok, pw1); }
    catch(_){ S.busy = false; S.error = "This browser can't encrypt the key. Open the page over https in Chrome or Safari."; render(); return; }
    store.set("token",""); store.set("repo", repo);
    S.busy = false; S.hasVault = true; S.legacy = ""; S.token = tok; S.repo = repo; S.error = ""; setSession(tok);
    load();
  }
  if(t.id==="unlock"){
    const pw = document.getElementById("pw").value;
    if(!pw || S.waitUntil > Date.now()) return;
    S.busy = true; render();
    try{
      const tok = await unseal(pw);
      S.busy = false; S.fails = 0; S.error = ""; S.token = tok; setSession(tok); load();
    }catch(_){
      S.busy = false; S.fails++;
      if(S.fails >= 5){ S.waitUntil = Date.now() + 30000; S.error = "Too many wrong tries. Wait 30 seconds."; setTimeout(() => { S.error = ""; render(); }, 30000); }
      else S.error = "Wrong password.";
      render();
    }
  }
});
document.addEventListener("input", e => {
  if(e.target.id==="q"){ S.q = e.target.value; render(); }
});
document.addEventListener("change", e => {
  if(e.target.id==="st"){ S.status = e.target.value; render(); }
});
function fromHash(){ const h = (location.hash||"").slice(1); if(["today","replies","approve","sent","leads","log","socials"].includes(h)) S.tab = h; }
window.addEventListener("hashchange", () => { fromHash(); render(); });
setInterval(() => { if(document.visibilityState==="visible" && (S.token || S.demo) && !S.loading) load(); }, 60000);
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState==="hidden"){ hiddenAt = Date.now(); return; }
  if(S.token && hiddenAt && Date.now() - hiddenAt > AWAY_MS){ lock(); return; }
  if(S.token) load();
});
